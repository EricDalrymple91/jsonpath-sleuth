name: Linux wheels

# Manual, default-branch-only. PRs/forks cannot build with credentials or publish.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested wheels to PyPI after the pypi environment gate
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: linux-wheels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'EricDalrymple91/jsonpath-sleuth' && github.ref == 'refs/heads/main' && vars.WHEEL_BUILDS_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    environment: wheel-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Install hash-verified tools through Socket
        env:
          UV_INDEX_SOCKET_USERNAME: ${{ secrets.SOCKET_FIREWALL_USERNAME }}
          UV_INDEX_SOCKET_PASSWORD: ${{ secrets.SOCKET_FIREWALL_PASSWORD }}
        run: bash scripts/setup_wheel_tools.sh
      - name: Test release guards with pytest
        run: python -m pytest -q tests/test_wheel_release.py
      - name: Build with existing Rust and Socket-only crates
        env:
          UV_INDEX_SOCKET_USERNAME: ${{ secrets.SOCKET_FIREWALL_USERNAME }}
          UV_INDEX_SOCKET_PASSWORD: ${{ secrets.SOCKET_FIREWALL_PASSWORD }}
        run: bash scripts/build_linux_wheel.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wheels-${{ matrix.architecture }}
          path: dist/*
          if-no-files-found: error

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    environment: wheel-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Install hash-verified test tools through Socket
        env:
          UV_INDEX_SOCKET_USERNAME: ${{ secrets.SOCKET_FIREWALL_USERNAME }}
          UV_INDEX_SOCKET_PASSWORD: ${{ secrets.SOCKET_FIREWALL_PASSWORD }}
        run: bash scripts/setup_wheel_tools.sh
      - name: Verify artifacts, install wheel offline, run existing Python tests
        env:
          UV_PYTHON_DOWNLOADS: never
          UV_NO_CONFIG: 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/wheel_release.py verify --commit "$GITHUB_SHA"
          uv pip install --python "$(command -v python)" --no-index --no-deps --only-binary :all: dist/*"$(uname -m)".whl
          cd "$RUNNER_TEMP"
          python -c 'import jsonpath_sleuth; print(jsonpath_sleuth.__file__)'
          python -m pytest --import-mode=importlib -q "$GITHUB_WORKSPACE/tests"

  publish:
    needs: [build, test]
    if: inputs.publish && github.repository == 'EricDalrymple91/jsonpath-sleuth' && github.ref == 'refs/heads/main' && vars.WHEEL_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Verify both tested architectures and publish using PyPI Trusted Publishing
        shell: bash
        run: |
          set -euo pipefail
          python scripts/wheel_release.py verify --commit "$GITHUB_SHA"
          image=ghcr.io/astral-sh/uv:0.13.6@sha256:af22a52f5eafef3d78e551599d405c02df61919d18028f0cea8eda93bc9986d0
          container=$(docker create "$image" --version)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/uv" "$RUNNER_TEMP/uv"
          "$RUNNER_TEMP/uv" publish --trusted-publishing always dist/*.whl
